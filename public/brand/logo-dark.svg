<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 56" width="340" height="56" role="img" aria-label="KolayKantar ERP — by Zersoft">
  <defs>
    <style>
      .kk-kolay { fill: #f0f9ff; }
      .kk-kantar { fill: #38bdf8; }
      .kk-sub { fill: #94a3b8; }
    </style>
    <linearGradient id="brandKGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="brandKGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="brandKBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
  </defs>

  <!-- ── Amblem Grubu (48x48) ── -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#070c15" stroke="rgba(14,165,233,0.35)" stroke-width="1.2"/>
    <rect x="11.5" y="10" width="4.5" height="26" rx="2.25" fill="url(#brandKGrad1)"/>
    <path d="M19 23 L32.5 10 L37 10 L23.5 23 Z" fill="url(#brandKGrad1)"/>
    <path d="M19 23 L33.5 35.5 L37 35.5 L22.5 23 Z" fill="url(#brandKGrad2)"/>
    <circle cx="20.5" cy="23" r="2.8" fill="#00f2fe"/>
    <circle cx="20.5" cy="23" r="1.1" fill="#ffffff"/>
    <path d="M9.5 40 L38.5 40" stroke="url(#brandKBase)" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="13.5" cy="40" r="1.1" fill="#00f2fe"/>
    <circle cx="34.5" cy="40" r="1.1" fill="#00f2fe"/>
  </g>

  <!-- ── Wordmark (Plus Jakarta Sans) ── -->
  <g transform="translate(64, 0)">
    <text
      x="0" y="34"
      font-family="'Plus Jakarta Sans','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
      font-size="25" font-weight="900"
      letter-spacing="0.5"
    ><tspan class="kk-kolay">KOLAY</tspan><tspan class="kk-kantar">KANTAR</tspan><tspan font-size="14" font-weight="800" fill="#22d3ee" dx="4">ERP</tspan></text>

    <text
      x="0" y="48"
      font-family="'Plus Jakarta Sans','Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif"
      font-size="8.5" font-weight="600"
      letter-spacing="1.5"
      class="kk-sub"
    >HİBRİT KANTAR VE SAHA OTOMASYONU • <tspan fill="#38bdf8" font-weight="700">ZERSOFT</tspan></text>
  </g>

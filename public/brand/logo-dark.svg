    </style>
    <linearGradient id="kkLoopG1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="kkPlatG1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <!-- ── Amblem Grubu (48x48) ── -->
  <g transform="translate(4, 4)">
    <rect x="0" y="0" width="48" height="48" rx="12" fill="#070c15" stroke="rgba(14,165,233,0.35)" stroke-width="1.2"/>
    <path d="M17 18 C12 18 9 21.5 9 25 C9 28.5 12 32 17 32 C21.5 32 24 27.5 24 25 C24 22.5 26.5 18 31 18 C36 18 39 21.5 39 25 C39 28.5 36 32 31 32 C26.5 32 24 27.5 24 25"
